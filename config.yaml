# Promo Finder Configuration

# LLM Configuration
# Easily swap models:
# - Anthropic: claude-3-7-sonnet-20250219, claude-3-5-sonnet-20241022, claude-3-opus-20240229
# - OpenAI: gpt-4o, gpt-4.5-preview, o1, o3-mini
# - Google GenAI: gemini-2.5-pro, gemini-1.5-pro, gemini-2.5-flash
# - OpenAI-compatible (OpenRouter, DeepSeek, vLLM): set api_base
model: "claude-3-5-sonnet-20241022"
provider: "auto"    # "auto", "anthropic", "openai", "gemini", or "heuristic"
api_base: null      # Optional custom base URL (e.g. "https://openrouter.ai/api/v1")

duration:
  min_s: 20.0
  max_s: 60.0
  hook_window_s: 3.0

scoring_weights:
  hook: 30
  cliffhanger: 30
  standalone: 20
  emotional_intensity: 10
  show_representativeness: 10

ranking:
  max_candidates_for_pairwise: 25
  max_promos_per_episode: 2
  require_hook_diversity: true
  top_n_final: 10

cross_episode:
  tail_duration_s: 40.0
  head_duration_s: 40.0

cache:
  enabled: true
  dir: "./.cache"

concurrency:
  max_workers: 4
